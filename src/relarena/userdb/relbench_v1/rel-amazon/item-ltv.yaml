database: db.yaml
entity_table: product
entity_col: product_id
time_col: timestamp
target_col: ltv
task_type: regression
timedelta: 91 days
num_eval_timestamps: 1
val_timestamp: '2015-10-01 00:00:00'
test_timestamp: '2016-01-01 00:00:00'
entities: all
query: |
  SELECT timestamp, product.product_id, COALESCE(SUM(price), 0) AS ltv
  FROM timestamp_df, product, review
  WHERE review.product_id = product.product_id
    AND review_time > timestamp AND review_time <= timestamp + INTERVAL '{timedelta}'
  GROUP BY timestamp, product.product_id
