[build-system]
requires = ["uv_build>=0.11.15"]
build-backend = "uv_build"

[project]
name = "relarena"
version = "0.0.2"
authors = [{ name = "Prior Labs" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/relarena/models/VENDORED-LICENSES"]
description = "A unified, fair benchmarking framework for models on relational tasks on RelBench databases."
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = [
    "benchmarking",
    "machine-learning",
    "relational-learning",
    "relbench",
    "tabular-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "relarena-core==0.0.1",
    # Pinned exactly: RelBench ships the dataset/task SHA256 checksums in the package
    # itself (relbench/datasets/hashes.json, relbench/tasks/hashes.json, wired into the
    # pooch registries in relbench/datasets/__init__.py and relbench/tasks/__init__.py),
    # so the package version is the data version. Pinning keeps a resolver bump from
    # swapping in a release with different data. Only bump the relbench version
    # deliberately (see below).
    # When upgrading: re-run `python workflows/record_checksums.py` and confirm the
    # recorded split checksums (src/relarena/checksums/relbench_v1_checksums.json) are unchanged — a new
    # RelBench release may reprocess the data even if the splits look unchanged.
    # (Also re-record whenever dataset.drop_noncanonical_columns changes.)
    "relbench==2.1.2",
    "numpy>=1.24",
    # Mirrors fastdfs' own pandas range (the dfs extras resolve it);
    # anything below 2.3.3 is unsatisfiable here.
    "pandas>=2.3.3,<3.0",
    "scikit-learn>=1.3",
    "configspace>=1.0",
    # pyyaml: loading PredictiveQuerySpec from a YAML task file (userdb).
    "pyyaml>=6.0",
    # jsonschema: validate a userdb task/database YAML against its JSON Schema.
    "jsonschema>=4.0",
    # torch: the GNN wrappers (graphsage, relgnn, relgt) import it at module level and
    # `relarena.models` imports them eagerly to register them, so importing the model
    # registry needs torch even when no GNN extra is installed. The rest of each GNN
    # stack (PyG, PyTorch Frame, the text embedder) stays in the rdl extra.
    "torch",
]

[project.urls]
Homepage = "https://github.com/PriorLabs/relarena"
Repository = "https://github.com/PriorLabs/relarena"
Issues = "https://github.com/PriorLabs/relarena/issues"
Paper = "https://arxiv.org/abs/2608.16319"

[project.scripts]
relarena = "relarena.cli:main"

[project.optional-dependencies]
# Per-method extras (lazy-import + optional-dependency pattern; imported when run).
lightgbm = ["lightgbm>=4.0,<4.7"]
# KurveRSC owns GraphReduce configuration search and CatBoost fitting. It is a
# native system entry because selection happens inside its end-to-end run.
kurversc = ["kurversc==0.1.1"]
# rdblearn: DFS features + a tabular foundation model. Carries the local TFM
# (tabpfn>=8 for the create_default_for_version API, lazily imported in relarena.models.rdblearn.tfm)
# plus the DFS featurization deps.
# setuptools<82 because featuretools -> woodwork imports pkg_resources at import
# time, and setuptools 82 removed it (81 still ships it).
rdblearn = ["tabpfn>=8", "relarena-core[dfs]==0.0.1"]
# rdl: the shared Relational Deep Learning stack for the GNN baselines — PyG + PyTorch
# Frame + a text embedder, which relbench.modeling.* needs (all lazy-imported inside
# fit()). GPU recommended. NOTE: PyG neighbor sampling needs `pyg-lib` or `torch-sparse`
# from the PyG wheel index — see README; not declared here because the right wheel
# depends on the torch/CUDA build of the target machine.
rdl = ["torch-geometric>=2.5", "pytorch-frame>=0.2.3", "sentence-transformers"]
# The GNN baselines build on that shared stack: graphsage (RelBench's heterogeneous
# GraphSAGE), relgnn (RelGNN composite message passing over atomic routes), and relgt
# (the Relational Graph Transformer dropped in for the GNN). relgt adds einops for the
# global-attention einsum and h5py for the pre-built token cache.
graphsage = ["relarena[rdl]"]
relgnn = ["relarena[rdl]"]
relgt = ["relarena[rdl]", "einops>=0.8", "h5py>=3.0"]
# The separate TabPFN-Rel package registers its models through entry points.
# The existing local and API extras install the corresponding model backend.
tabpfn-rel-local = ["tabpfn-rel[local]>=0.0.1,<0.1"]
tabpfn-rel-api = ["tabpfn-rel[api]>=0.0.1,<0.1"]
# RelArena supports RT execution on Linux x86_64, for which relational-transformer
# publishes a stable-ABI (abi3-py311) wheel. GPU strongly recommended -- a
# fine-tune on CPU is not a practical run.
rt = ["relational-transformer==1.8.0"]
# TabArena-style leaderboard aggregation (ELO / win-rate / rank / normalized
# loss). bencheval is TabArena's standalone leaderboard package — no
# AutoGluon/torch dependency. See relarena/evaluation/leaderboard.py.
leaderboard = ["bencheval"]
# Leaderboard plots (relarena/evaluation/plots.py): normalized-loss heatmaps + the
# critical-difference diagram. bencheval's `[plot]` extra ships the
# matplotlib/seaborn/plotly stack and the CD plot; `autorank` runs the Demšar
# significance test.
plots = ["bencheval[plot]", "autorank"]


[project.entry-points."relarena.models"]
relarena = "relarena.models"
