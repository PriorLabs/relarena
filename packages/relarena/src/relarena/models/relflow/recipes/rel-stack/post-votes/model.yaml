    encoder_pooling: mean
    max_length: 48
    cache: false
  body:
    type: text
    model: sentence-transformers/all-MiniLM-L6-v2
    encoder_batch_size: 1280
    encoder_pooling: mean
    max_length: 128
    cache: false
  tags:
    type: text
    model: sentence-transformers/all-MiniLM-L6-v2
    encoder_batch_size: 1280
    encoder_pooling: mean
    max_length: 48
    cache: false
  votes:
