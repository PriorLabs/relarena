d_model: 96
n_layers: 2
n_heads: 4
fields:
  entity_id:
    type: hash
    n_hashes: 4
  created_at:
    type: dateparts
    dateparts:
    - month_of_year
    - day_of_week
  display_name:
    type: hash
    n_hashes: 4
  website_url:
    type: hash
    n_hashes: 4
  location:
    type: text
    model: sentence-transformers/all-MiniLM-L6-v2
    encoder_batch_size: 1280
    encoder_pooling: mean
    max_length: 16
    cache: false
  about_me:
    type: text
    model: sentence-transformers/all-MiniLM-L6-v2
    encoder_batch_size: 1280
    encoder_pooling: mean
    max_length: 64
    cache: false
  account_id:
    type: hash
    n_hashes: 4
  badges:
    type: branch
    length: 64
    overflow: tail
    fields:
      age_days:
        type: number
      badge_name:
        type: category
      badge_class:
        type: category
      tag_based:
        type: boolean
  posts:
    type: branch
    length: 64
    overflow: tail
    fields:
      age_days:
        type: number
      post_id:
        type: hash
        n_hashes: 4
      post_type:
        type: category
      parent_id:
        type: hash
        n_hashes: 4
      title:
        type: text
        model: sentence-transformers/all-MiniLM-L6-v2
        encoder_batch_size: 1280
        encoder_pooling: mean
        max_length: 32
        cache: false
      body:
        type: text
        model: sentence-transformers/all-MiniLM-L6-v2
        encoder_batch_size: 1280
        encoder_pooling: mean
        max_length: 64
        cache: false
      tags:
        type: text
        model: sentence-transformers/all-MiniLM-L6-v2
        encoder_batch_size: 1280
        encoder_pooling: mean
        max_length: 16
        cache: false
  comments:
    type: branch
    length: 64
    overflow: tail
    fields:
      age_days:
        type: number
      post_id:
        type: hash
        n_hashes: 4
      comment_text:
        type: text
        model: sentence-transformers/all-MiniLM-L6-v2
        encoder_batch_size: 1280
        encoder_pooling: mean
        max_length: 32
        cache: false
  votes:
    type: branch
    length: 64
    overflow: tail
    fields:
      age_days:
        type: number
      post_id:
        type: hash
        n_hashes: 4
      vote_type:
        type: category
  target:
    type: boolean
    mask: true
ffnx: 8
dropout: 0.1
embed: false
batch_size: 4096
