        type: number
      ad_id:
        type: hash
        n_hashes: 4
  phone_requests:
    type: branch
    length: 64
    overflow: tail
    fields:
      age_days:
        type: number
      ad_id:
        type: hash
        n_hashes: 4
  target:
    type: boolean
    mask: true
