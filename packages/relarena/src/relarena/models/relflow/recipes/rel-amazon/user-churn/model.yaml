d_model: 96
n_layers: 2
n_heads: 4
fields:
  entity_id:
    type: hash
    n_hashes: 4
  customer_name:
    type: text
    model: sentence-transformers/all-MiniLM-L6-v2
    max_length: 16
    encoder_batch_size: 1280
    encoder_pooling: mean
    cache: false
  reviews:
    type: branch
    length: 64
    overflow: tail
    fields:
      age_days:
        type: number
      product_id:
        type: hash
        n_hashes: 4
      rating:
        type: number
      verified:
        type: category
      summary:
        type: text
        model: sentence-transformers/all-MiniLM-L6-v2
        max_length: 32
        encoder_batch_size: 1280
        encoder_pooling: mean
        cache: false
      review_text:
        type: text
        model: sentence-transformers/all-MiniLM-L6-v2
        max_length: 64
        encoder_batch_size: 1280
        encoder_pooling: mean
        cache: false
  target:
    type: boolean
    mask: true
ffnx: 8
dropout: 0.1
embed: false
batch_size: 8192
