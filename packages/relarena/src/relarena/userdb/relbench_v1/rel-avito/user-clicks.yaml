database: db.yaml
entity_table: UserInfo
entity_col: UserID
time_col: timestamp
target_col: num_click
task_type: binary_classification
timedelta: 4 days
num_eval_timestamps: 1
val_timestamp: '2015-05-08 00:00:00'
test_timestamp: '2015-05-14 00:00:00'
entities: all
query: |
  SELECT search_ads.UserID, t.timestamp,
    COALESCE(COUNT(search_ads.AdID), 0) > 1 AS num_click
  FROM timestamp_df t
  LEFT JOIN (
    (UserInfo LEFT JOIN SearchInfo ON UserInfo.UserID = SearchInfo.UserID) user_search_info
    LEFT JOIN SearchStream
      ON user_search_info.SearchID = SearchStream.SearchID AND SearchStream.IsClick = 1.0
  ) search_ads
    ON search_ads.SearchDate > t.timestamp
   AND search_ads.SearchDate <= t.timestamp + INTERVAL '{timedelta}'
  GROUP BY t.timestamp, search_ads.UserID
