database: db.yaml
entity_table: facilities
entity_col: facility_id
time_col: timestamp
target_col: success_rate
task_type: regression
timedelta: 365 days
num_eval_timestamps: 1
val_timestamp: '2020-01-01 00:00:00'
test_timestamp: '2021-01-01 00:00:00'
entities: all
query: |
  WITH trial_info AS (
      SELECT oa.nct_id,
             MIN(CASE WHEN oa.p_value < 0.05 THEN 1 ELSE 0 END) AS is_successful,
             oa.date
      FROM outcome_analyses oa
      LEFT JOIN outcomes o ON oa.outcome_id = o.id
      WHERE (oa.p_value_modifier IS NULL OR oa.p_value_modifier != '>')
        AND oa.p_value >= 0 AND oa.p_value <= 1 AND o.outcome_type = 'Primary'
      GROUP BY oa.nct_id, oa.date
  )
  SELECT t.timestamp, fs.facility_id,
         SUM(tr.is_successful) / COUNT(tr.is_successful) AS success_rate
  FROM timestamp_df t
  LEFT JOIN trial_info tr
  LEFT JOIN facilities_studies fs ON fs.nct_id = tr.nct_id
    ON tr.date > t.timestamp AND tr.date <= t.timestamp + INTERVAL '{timedelta}'
  WHERE fs.facility_id IS NOT NULL
  GROUP BY t.timestamp, fs.facility_id
