[project]
name = "relarena-workspace"
version = "0.0.0"
requires-python = ">=3.11,<3.13"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.0",
    "ruff==0.15.13",
    # Focused adapter tests exercise the public optional-package boundary.
    "kurversc==0.1.1",
    "lightgbm>=4.0,<4.7",
    "fastdfs>=1.1",
    # Match the woodwork/pkg_resources cap in the core DFS extra.
    "setuptools<82",
]
# The "cuda" and "cpu" groups switch between the cuda and CPU-only versions of torch.
# With no group, torch comes from package dependencies via pypi, which is the cuda
# build. The "cuda" group is a dummy, required for the "conflicts" option below.
cuda = []
# The CPU-only build avoids downloading CUDA when not required.
cpu = ["torch"]

[tool.uv]
package = false
exclude-newer = "3 days"
# These packages were published after the global cutoff while their exact
# dependency pins were being integrated. Exact pins keep the exemptions
# reproducible without weakening the cutoff for unrelated dependencies.
exclude-newer-package = { relational-transformer = false, graphreduce = false, kurversc = false }
conflicts = [
    # Specifying this conflict avoids uv trying to resolve the pypi and cpu versions
    # of torch simultaneously.
    [{ group = "cuda" }, { group = "cpu" }],
]

[tool.uv.sources]
relarena = { workspace = true }
relarena-core = { workspace = true }
# bencheval lives in the autogluon/tabarena uv-workspace under packages/bencheval.
# The resolved commit is pinned in uv.lock for reproducibility.
bencheval = { git = "https://github.com/autogluon/tabarena.git", subdirectory = "packages/bencheval", rev = "9f3878b882439cb885003b5f978676961b059b6d" }
# If the "cpu" group is specified, then download torch from the matching index rather
# than pypi.
torch = [{ index = "pytorch-cpu", group = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
src = ["packages/relarena/src", "packages/relarena-core/src"]
required-version = "==0.15.13"
force-exclude = true
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "ANN",
    "D",
    "E",
    "F",
    "I",
    "W",
]
ignore = [
    "ANN002",
    "ANN003",
    "ANN204",
    "ANN401",
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.override", "typing_extensions.override"]

[tool.ruff.lint.per-file-ignores]
"**/workflows/**/*.py" = [
    "E501",
]
"**/tests/**/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",
    "D106",
    "D107",
    "S101",
]

[tool.uv.workspace]
members = ["packages/relarena", "packages/relarena-core"]

[tool.pytest.ini_options]
testpaths = ["packages/relarena/tests", "packages/relarena-core/tests"]
addopts = "--import-mode=importlib"
