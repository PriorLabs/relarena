name: RelArena licenses

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - workflows/audit_licenses.py
      - .github/workflows/licenses.yml
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  audit:
    name: relarena dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Gate on dependency licenses and write the report
        run: |
          python3 workflows/audit_licenses.py \
            --check --output "$RUNNER_TEMP/dependency-licenses.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: relarena-dependency-licenses
          path: ${{ runner.temp }}/dependency-licenses.md
          if-no-files-found: warn
