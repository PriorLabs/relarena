name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    name: Ruff, tests, and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --group dev --group cpu --extra leaderboard --extra plots --extra rt
      - name: Verify test interpreter
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          uv run python -c 'import os, sys; actual = f"{sys.version_info.major}.{sys.version_info.minor}"; expected = os.environ["EXPECTED_PYTHON"]; assert actual == expected, f"Expected Python {expected}, got {actual}"'
      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Run tests
        env:
          OMP_NUM_THREADS: "1"
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Verify required package data
        run: python workflows/verify_distributions.py
