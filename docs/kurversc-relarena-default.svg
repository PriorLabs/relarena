<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
  <title id="title">KurveRSC default RelArena reproducibility configuration</title>
  <desc id="desc">Official censored relational data enters a full-data graph configuration search on one latest cutoff. The top three candidates are reranked on three complete cutoff folds processed sequentially. A stability-adjusted winner is frozen and fitted on one latest full cutoff before the operation plan is replayed for test prediction.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, Helvetica, sans-serif; fill: #0F172A; }
      .subtitle { font: 600 19px Arial, Helvetica, sans-serif; fill: #334155; }
      .step { font: 700 14px Arial, Helvetica, sans-serif; fill: #4F46E5; letter-spacing: 1.2px; }
      .heading { font: 700 22px Arial, Helvetica, sans-serif; fill: #0F172A; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #0F172A; }
      .body { font: 600 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 600 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .white { fill: #FFFFFF; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .flow { fill: none; stroke: #64748B; stroke-width: 3; marker-end: url(#arrow); }
      .check { fill: none; stroke: #FFFFFF; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1800" height="960" rx="28" fill="url(#background)"/>
  <text x="70" y="65" class="title">RelArena default: full-data selection with bounded temporal confirmation</text>
  <text x="70" y="103" class="subtitle">Every graph candidate sees complete source tables; cutoff folds and candidates are materialized sequentially to bound feature-frame memory.</text>

  <!-- configuration strip -->
  <g transform="translate(70 135)">
    <rect width="1660" height="80" rx="16" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
    <text x="25" y="31" class="step">REFERENCE PROFILE</text>
    <text x="25" y="58" class="body">full search data</text>
    <line x1="190" y1="17" x2="190" y2="63" stroke="#E2E8F0" stroke-width="2"/>
    <text x="215" y="31" class="small">SEARCH CUTOFFS</text><text x="215" y="57" class="label">1 · latest</text>
    <line x1="390" y1="17" x2="390" y2="63" stroke="#E2E8F0" stroke-width="2"/>
    <text x="415" y="31" class="small">FINALISTS / FOLDS</text><text x="415" y="57" class="label">top 3 · 3 sequential</text>
    <line x1="670" y1="17" x2="670" y2="63" stroke="#E2E8F0" stroke-width="2"/>
    <text x="695" y="31" class="small">FINAL FIT</text><text x="695" y="57" class="label">1 · latest full cutoff</text>
    <line x1="920" y1="17" x2="920" y2="63" stroke="#E2E8F0" stroke-width="2"/>
    <text x="945" y="31" class="small">TEMPORAL POLICY</text><text x="945" y="57" class="label">fixed GraphReduce periods</text>
    <line x1="1235" y1="17" x2="1235" y2="63" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1260" y="31" class="small">TEXT / LEARNER</text><text x="1260" y="57" class="label">off · CatBoost seed 0</text>
  </g>

  <!-- stage 1 -->
  <g filter="url(#shadow)"><rect x="70" y="275" width="260" height="420" rx="20" class="card"/></g>
  <text x="95" y="310" class="step">01 · OFFICIAL INPUT</text>
  <text x="95" y="345" class="heading">Censored database</text>
  <text x="95" y="374" class="body">RelBench train/val phase</text>
  <text x="95" y="398" class="body">with authoritative keys,</text>
  <text x="95" y="422" class="body">dates, and cutoff filters</text>
  <line x1="145" y1="505" x2="215" y2="465" stroke="#64748B" stroke-width="4"/>
  <line x1="145" y1="505" x2="215" y2="550" stroke="#64748B" stroke-width="4"/>
  <circle cx="145" cy="505" r="34" fill="#C7D2FE" stroke="#4F46E5" stroke-width="3"/>
  <circle cx="215" cy="465" r="26" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
  <circle cx="215" cy="550" r="26" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
  <text x="145" y="510" class="small" text-anchor="middle">root</text>
  <text x="215" y="470" class="small" text-anchor="middle">child</text>
  <text x="215" y="555" class="small" text-anchor="middle">child</text>
  <rect x="95" y="610" width="210" height="55" rx="10" fill="#EFF6FF"/>
  <text x="200" y="633" class="small" text-anchor="middle">No rows after each</text>
  <text x="200" y="653" class="label" text-anchor="middle">prediction cutoff</text>

  <path d="M330 485 H370" class="flow"/>

  <!-- stage 2 -->
  <g filter="url(#shadow)"><rect x="385" y="275" width="330" height="420" rx="20" class="card"/></g>
  <text x="410" y="310" class="step">02 · GRAPH SEARCH</text>
  <text x="410" y="345" class="heading">Complete latest frame</text>
  <text x="410" y="374" class="body">Each admitted configuration</text>
  <text x="410" y="398" class="body">is rebuilt on all source rows</text>
  <rect x="410" y="435" width="280" height="70" rx="11" fill="#EEF2FF" stroke="#818CF8" stroke-width="2"/>
  <path d="M445 435v70M480 435v70M515 435v70M550 435v70M585 435v70M620 435v70M655 435v70M410 458h280M410 481h280" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="410" y="538" class="label">Searches</text>
  <text x="410" y="565" class="body">depth · feature families</text>
  <text x="410" y="589" class="body">annotations · column funnel</text>
  <text x="410" y="613" class="body">adaptive depth promotion</text>
  <rect x="410" y="635" width="280" height="35" rx="8" fill="#F8FAFC"/>
  <text x="550" y="658" class="small" text-anchor="middle">cap 4/family · width guard 8,000</text>

  <path d="M715 485 H755" class="flow"/>

  <!-- stage 3 -->
  <g filter="url(#shadow)"><rect x="770" y="275" width="330" height="420" rx="20" class="card"/></g>
  <text x="795" y="310" class="step">03 · TEMPORAL RERANK</text>
  <text x="795" y="345" class="heading">Top 3 × three folds</text>
  <text x="795" y="374" class="body">Complete relational cutoffs</text>
  <text x="795" y="398" class="body">are processed one at a time</text>
  <g transform="translate(795 440)">
    <rect x="0" y="0" width="80" height="88" rx="10" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <rect x="100" y="0" width="80" height="88" rx="10" fill="#E0E7FF" stroke="#818CF8" stroke-width="2"/>
    <rect x="200" y="0" width="80" height="88" rx="10" fill="#F3E8FF" stroke="#A78BFA" stroke-width="2"/>
    <text x="40" y="35" class="small" text-anchor="middle">cutoff</text><text x="40" y="61" class="label" text-anchor="middle">c₁</text>
    <text x="140" y="35" class="small" text-anchor="middle">cutoff</text><text x="140" y="61" class="label" text-anchor="middle">c₂</text>
    <text x="240" y="35" class="small" text-anchor="middle">cutoff</text><text x="240" y="61" class="label" text-anchor="middle">c₃</text>
  </g>
  <path d="M835 548 H1035" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="935" y="576" class="small" text-anchor="middle">materialize → score → release</text>
  <rect x="795" y="605" width="280" height="65" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="935" y="630" class="small" text-anchor="middle">raw metric − stability penalty</text>
  <text x="935" y="654" class="label" text-anchor="middle">select q*</text>

  <path d="M1100 485 H1140" class="flow"/>

  <!-- stage 4 -->
  <g filter="url(#shadow)"><rect x="1155" y="275" width="260" height="420" rx="20" class="card"/></g>
  <text x="1180" y="310" class="step">04 · FREEZE</text>
  <text x="1180" y="345" class="heading">Fitted artifact</text>
  <rect x="1180" y="390" width="210" height="100" rx="15" fill="url(#selected)"/>
  <circle cx="1220" cy="440" r="22" fill="#FFFFFF" fill-opacity="0.18"/>
  <path d="M1209 440l8 8 15-19" class="check"/>
  <text x="1255" y="430" class="label white">Selected q*</text>
  <text x="1255" y="455" class="small white">validated shape</text>
  <text x="1180" y="535" class="label">Frozen state</text>
  <text x="1180" y="564" class="body">operation lineage</text>
  <text x="1180" y="588" class="body">ordered schema</text>
  <text x="1180" y="612" class="body">temporal windows</text>
  <text x="1180" y="636" class="body">category decisions</text>

  <path d="M1415 485 H1455" class="flow"/>

  <!-- stage 5 -->
  <g filter="url(#shadow)"><rect x="1470" y="275" width="260" height="420" rx="20" class="card"/></g>
  <text x="1495" y="310" class="step">05 · REFIT + TEST</text>
  <text x="1495" y="345" class="heading">One full cutoff</text>
  <text x="1495" y="374" class="body">Replay q* on latest train</text>
  <text x="1495" y="398" class="body">history and fit CatBoost</text>
  <rect x="1495" y="435" width="210" height="68" rx="10" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
  <text x="1600" y="463" class="small" text-anchor="middle">complete production frame</text>
  <text x="1600" y="487" class="label" text-anchor="middle">latest cutoff</text>
  <path d="M1600 503 V548" class="flow"/>
  <rect x="1495" y="560" width="210" height="62" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1600" y="586" class="small" text-anchor="middle">frozen-plan replay</text>
  <text x="1600" y="608" class="label" text-anchor="middle">test predictions</text>
  <text x="1600" y="655" class="small" text-anchor="middle">no feature rediscovery</text>

  <!-- memory contract -->
  <rect x="70" y="750" width="1660" height="130" rx="18" fill="#0F172A"/>
  <text x="100" y="790" class="step white">DEFAULT MEMORY CONTRACT</text>
  <text x="100" y="828" class="subtitle white">At most one materialized feature frame is retained at a time during search, reranking, final fitting, and prediction.</text>
  <text x="100" y="858" class="body white">DuckDB per-task ceiling: 64 GB · spill ceiling: 128 GB · larger cutoff ensembles remain explicit, non-default parameters.</text>
  <rect x="1430" y="785" width="260" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.12"/>
  <text x="1560" y="811" class="small white" text-anchor="middle">REPRODUCED RESULT</text>
  <text x="1560" y="835" class="label white" text-anchor="middle">12 / 20 resolved wins</text>
</svg>
